name: LPMVault
options:
  bundleIdPrefix: dev.lpm
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: LPM Vault
    PRODUCT_BUNDLE_IDENTIFIER: dev.lpm.vault
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
    INFOPLIST_KEY_CFBundleDisplayName: "LPM Vault"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGNING_REQUIRED: YES
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

targets:
  LPMVault:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "Resources/**"
    resources:
      - path: Sources/Assets.xcassets
      - path: Sources/Resources
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: LPMVault.entitlements
        PRODUCT_MODULE_NAME: LPMVault
        ENABLE_APP_SANDBOX: NO
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_LSUIElement: NO
        INFOPLIST_KEY_NSSupportsAutomaticTermination: NO
        COMBINE_HIDPI_IMAGES: YES

  LPMVaultTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: LPMVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lpm.vault.tests
        PRODUCT_NAME: LPMVaultTests
        PRODUCT_MODULE_NAME: LPMVaultTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LPM Vault.app/Contents/MacOS/LPM Vault"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  LPMVault:
    build:
      targets:
        LPMVault: [run, test, build]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LPMVaultTests
