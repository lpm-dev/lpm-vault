name: Verify signed release
on:
  push:
    tags: ['release-check-*']
  workflow_dispatch:
    inputs:
      version:
        description: Test app version
        required: true
        default: '1.0.0'
      build:
        description: Test app build number
        required: true
        default: '3'
permissions:
  contents: read
concurrency:
  group: vault-release-verification
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  verify:
    needs: checks
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Sign, notarize, and verify without publication
        env:
          TEST_VERSION: ${{ inputs.version || '1.0.0' }}
          TEST_BUILD: ${{ inputs.build || '3' }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_VAULT_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_VAULT_PROVISIONING_PROFILE_BASE64 }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 LPMVault/Scripts/ci-release.py --verify-only --version "$TEST_VERSION" --build "$TEST_BUILD"
      - name: Save verified installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vault-verified-installers
          path: |
            release-output/*.dmg
            release-output/*.zip
            release-output/appcast.xml
            release-output/checksums.txt
            release-output/release-manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Delete signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/vault-signing/release.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/vault-signing"
