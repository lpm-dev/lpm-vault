name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  macos:
    name: macOS tests and release bundle
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Install pinned env engine toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component llvm-tools-preview --target aarch64-apple-darwin,x86_64-apple-darwin
      - name: Reproduce bundled env engine
        run: python3 LPMVault/Scripts/verify-env-engine.py --rebuild --target-dir "$RUNNER_TEMP/env-engine-target"
      - name: Swift tests
        run: bash LPMVault/Scripts/swift-test-watchdog.sh --package-path LPMVault --disable-automatic-resolution -Xswiftc -warnings-as-errors
      - name: Preserve failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-test-diagnostics
          path: ~/Library/Logs/DiagnosticReports/*
          if-no-files-found: ignore
          retention-days: 7
      - name: Cooperative executor regressions
        run: bash LPMVault/Scripts/Tests/cooperative-executor-tests.sh
      - name: Release tooling tests
        run: |
          bash LPMVault/Scripts/Tests/release-tooling-tests.sh
          bash LPMVault/Scripts/fetch-sparkle-tools.sh "$RUNNER_TEMP/sparkle-test-tools"
          SPARKLE_TEST_TOOLS="$RUNNER_TEMP/sparkle-test-tools" python3 -m unittest discover -s LPMVault/Scripts/Tests -p 'test_*.py'
      - name: Build universal release bundle
        run: |
          xcodebuild -project LPMVault/LPMVault.xcodeproj -scheme LPMVault -configuration Release -destination 'generic/platform=macOS' -derivedDataPath build-check CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES GCC_TREAT_WARNINGS_AS_ERRORS=YES build
          python3 LPMVault/Scripts/verify-update-config.py 'build-check/Build/Products/Release/LPM Vault.app/Contents/Info.plist'
      - name: Verify nested signing
        run: |
          bash LPMVault/Scripts/sign-sparkle.sh 'build-check/Build/Products/Release/LPM Vault.app' - --timestamp=none
          codesign --force --sign - 'build-check/Build/Products/Release/LPM Vault.app'
          codesign --verify --deep --strict 'build-check/Build/Products/Release/LPM Vault.app'
  web:
    name: Public update routes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web --ignore-scripts
      - run: npm run build:sdk --prefix web && git diff --exit-code -- web/public/vendor
      - run: npx --prefix web playwright install --with-deps chromium
      - run: node --test web/tests/test_*.cjs
      - run: python3 web/tests/test_routes.py
      - run: python3 web/tests/test_proxy.py
