name: CI
# The required checks: for a pull request, for the merge queue's run of it
# merged with main, and before a release. A commit that lands on main has
# passed here as a merge group, so no run follows the push; the post-merge
# checks run what this leaves out.
on:
  pull_request:
  merge_group:
  workflow_call:
permissions:
  contents: read
# A pull request's newer commit replaces the run of its older one, whose
# result nothing waits for. Every other run finishes: the merge queue ends
# its own runs, and a release calls this workflow and the UI regressions
# from one run, so the two take different groups.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # To find the pull request run that passed a merge group's tree.
      actions: read
    outputs:
      engine: ${{ steps.engine.outputs.needed }}
      verified: ${{ steps.passed.outputs.verified }}
      run: ${{ steps.passed.outputs.run }}
    steps:
      # A pull request's merge commit and its first parent, the base branch.
      # A merge group can hold more than one commit, so its base needn't be
      # its first parent; the whole history has it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'merge_group' && 0 || 2 }}
      - name: Find changes the engine reproduction needs to check
        id: engine
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
        run: python3 LPMVault/Scripts/engine-changes.py --event "$GITHUB_EVENT_NAME" --github-output "$GITHUB_OUTPUT" ${BASE:+"$BASE"}
      # A pull request queued before main moves again merges as the tree its
      # own run checked, and the macOS jobs would only repeat.
      - name: Find a pull request run that passed this tree
        id: passed
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 LPMVault/Scripts/ci-passed-tree.py find --repository "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT"
  swift:
    name: Swift tests
    needs: plan
    if: needs.plan.outputs.verified != 'true'
    uses: ./.github/workflows/swift-tests.yml
    with:
      shard: rest
      diagnostics: macos-test-diagnostics
      cooperative: true
  engine:
    name: Bundled env engine reproduction
    needs: plan
    if: needs.plan.outputs.verified != 'true' && needs.plan.outputs.engine == 'true'
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned env engine toolchain
        # The toolchain and targets the bundled engine was built with, as its
        # provenance records them, so a re-export can't leave them behind.
        run: |
          read -r toolchain targets < <(python3 -c 'import json; p = json.load(open("LPMVault/Vendor/EnvEngine/provenance.json")); print(p["toolchain"], ",".join(p["targets"]))')
          rustup toolchain install "$toolchain" --profile minimal --component llvm-tools-preview --target "$targets"
      - name: Identify compatible engine cache
        id: cache-key
        run: python3 LPMVault/Scripts/ci-cache-key.py engine --github-output "$GITHUB_OUTPUT"
      - name: Restore engine dependencies and intermediates
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/env-engine-target
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}
      - name: Reproduce bundled env engine
        run: python3 LPMVault/Scripts/verify-env-engine.py --rebuild --target-dir "$RUNNER_TEMP/env-engine-target"
      - name: Save engine dependencies and intermediates
      # The merge queue's branch is gone once its run ends, so a cache saved
      # from it could never be restored.
        if: github.event_name != 'merge_group' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/env-engine-target
          key: ${{ steps.cache-key.outputs.key }}
  # A pull request and the merge queue's run of it compile one architecture,
  # the same one, so that either run can stand for the other. The x86_64
  # half is compiled once the commit is on main, and before a release.
  release:
    name: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'arm64' || 'Universal' }} release bundle verification
    needs: plan
    if: needs.plan.outputs.verified != 'true'
    uses: ./.github/workflows/release-bundle.yml
    with:
      architectures: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'arm64' || 'arm64 x86_64' }}
  macos:
    name: macOS tests and release bundle
    needs: [plan, swift, engine, release]
    # Not skipped when a run is cancelled or a job fails: a skipped check
    # would count as passed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require every macOS verification job
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 LPMVault/Scripts/ci-results.py
      # The checkout is the pull request's merge with its base, the tree
      # every job above checked.
      - name: Name the tree these checks passed
        id: tree
        if: github.event_name == 'pull_request'
        run: python3 LPMVault/Scripts/ci-passed-tree.py record --marker "$RUNNER_TEMP/passed-tree" --github-output "$GITHUB_OUTPUT"
      - name: Record that these checks passed this tree
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.tree.outputs.name }}
          path: ${{ runner.temp }}/passed-tree
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  web:
    name: Public update routes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web --ignore-scripts
      - run: npm run build:sdk --prefix web && git diff --exit-code -- web/public/vendor
      # The runner image already has Chromium's libraries, and the site serves
      # its own fonts. --with-deps would add only fallback fonts and xvfb, and
      # downloading them from Ubuntu's mirror has taken most of the time limit.
      - run: npx --prefix web playwright install chromium
      - run: node --test web/tests/test_*.cjs
      - run: python3 web/tests/test_routes.py
      - run: python3 web/tests/test_proxy.py
