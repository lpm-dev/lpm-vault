name: Release bundle
on:
  workflow_call:
    inputs:
      architectures:
        description: The architectures to compile the app for, as xcodebuild reads ARCHS, such as "arm64" or "arm64 x86_64".
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    name: Build
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    # Compiling the app once for each architecture takes 9 to 15 minutes on
    # these 3-core runners, cache or not, and a slow runner has needed more
    # than twice that.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify bundled env engine integrity
        run: python3 LPMVault/Scripts/verify-env-engine.py
      - name: Identify compatible release cache
        id: cache-key
        run: python3 LPMVault/Scripts/ci-cache-key.py release --github-output "$GITHUB_OUTPUT"
      - name: Restore release dependencies and intermediates
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build-check
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}
      - name: Restore timestamps of unchanged release inputs
        run: python3 LPMVault/Scripts/ci-cache-key.py release --restore-source-times
      - name: Release tooling tests
        run: |
          bash LPMVault/Scripts/Tests/release-tooling-tests.sh
          bash LPMVault/Scripts/fetch-sparkle-tools.sh "$RUNNER_TEMP/sparkle-test-tools"
          SPARKLE_TEST_TOOLS="$RUNNER_TEMP/sparkle-test-tools" python3 -m unittest discover -s LPMVault/Scripts/Tests -p 'test_*.py'
      - name: Build release bundle
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
        run: |
          xcodebuild -project LPMVault/LPMVault.xcodeproj -scheme LPMVault -configuration Release -destination 'generic/platform=macOS' -derivedDataPath build-check ARCHS="$ARCHITECTURES" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO COMPILER_INDEX_STORE_ENABLE=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES GCC_TREAT_WARNINGS_AS_ERRORS=YES build
          python3 LPMVault/Scripts/verify-update-config.py 'build-check/Build/Products/Release/LPM Vault.app/Contents/Info.plist'
      - name: Verify nested signing
        run: |
          bash LPMVault/Scripts/sign-sparkle.sh 'build-check/Build/Products/Release/LPM Vault.app' - --timestamp=none
          codesign --force --sign - 'build-check/Build/Products/Release/LPM Vault.app'
          codesign --verify --deep --strict 'build-check/Build/Products/Release/LPM Vault.app'
      - name: Record release build input timestamps
        run: python3 LPMVault/Scripts/ci-cache-key.py release --record-source-times
      - name: Save release dependencies and intermediates
      # The merge queue's branch is gone once its run ends, so a cache saved
      # from it could never be restored.
        if: github.event_name != 'merge_group' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build-check
          key: ${{ steps.cache-key.outputs.key }}
