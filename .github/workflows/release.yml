name: Signed release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: vault-production-release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Sign, notarize, verify, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_VAULT_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_VAULT_PROVISIONING_PROFILE_BASE64 }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 LPMVault/Scripts/ci-release.py
      - name: Delete signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/vault-signing/release.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/vault-signing"
