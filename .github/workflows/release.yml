name: Signed release
on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to release, MAJOR.MINOR.PATCH and equal to the project's version. Leave empty for a nightly.
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: vault-production-release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the version to release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Releases run only from main."
            exit 1
          fi
          python3 LPMVault/Scripts/ci-release.py --check-version "$RELEASE_VERSION"
  checks:
    needs: [version]
    # The CI workflow's plan job asks for it, and a called workflow can't have
    # more than its caller grants.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
  ui:
    needs: [version]
    uses: ./.github/workflows/ui.yml
  release:
    needs: [checks, ui]
    runs-on: macos-15
    # The signing and Sparkle keys live in this environment, which only main can use.
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Sign, notarize, verify, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          IMMUTABLE_RELEASES_READ_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_READ_TOKEN }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_VAULT_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_VAULT_PROVISIONING_PROFILE_BASE64 }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            python3 LPMVault/Scripts/ci-release.py --channel stable --version "$RELEASE_VERSION"
          else
            python3 LPMVault/Scripts/ci-release.py --channel nightly
          fi
      - name: Delete signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/vault-signing/release.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/vault-signing"
