name: UI regressions
# The native UI suite reads the screen with Vision, which is CPU-only and
# several times slower on hosted runners, so it runs here rather than in the
# pull request checks: after every merge to main, on demand, for a pull
# request labeled ui-tests, and before every release. Contributors run it
# locally before pushing. An on-demand run given a filter runs only the
# tests it matches, on one runner.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      filter:
        description: Run only the UI tests whose identifier matches this regular expression, such as VaultProjectOrderTests/dragAutoscrolls. Empty runs them all.
        required: false
        default: ''
        type: string
  workflow_call:
permissions:
  contents: read
jobs:
  ui:
    name: UI regressions (${{ matrix.shard }}/${{ strategy.job-total }})
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ui-tests') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ui-tests'))
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.filter && '[1]' || '[1, 2, 3, 4]') }}
    uses: ./.github/workflows/swift-tests.yml
    with:
      shard: ${{ matrix.shard }}/${{ strategy.job-total }}
      filter: ${{ inputs.filter }}
      diagnostics: ui-test-diagnostics-${{ matrix.shard }}
