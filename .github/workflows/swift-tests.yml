name: Swift tests
on:
  workflow_call:
    inputs:
      shard:
        description: The tests to run, as swift-test-shard.py reads SWIFT_TEST_SHARD; the UI suite's tests run apart from every other.
        required: true
        type: string
      diagnostics:
        description: The name of the artifact that keeps a failed run's diagnostics.
        required: true
        type: string
      cooperative:
        description: Also run the cooperative executor regressions.
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  test:
    name: Run
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Verify bundled env engine integrity
        run: python3 LPMVault/Scripts/verify-env-engine.py
      - name: Identify compatible Swift cache
        id: cache-key
        run: python3 LPMVault/Scripts/ci-cache-key.py swift --github-output "$GITHUB_OUTPUT"
      - name: Restore Swift dependencies and intermediates
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: LPMVault/.build
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}
      - name: Restore timestamps of unchanged Swift inputs
        run: python3 LPMVault/Scripts/ci-cache-key.py swift --restore-source-times
      - name: Build Swift tests
        run: swift build --build-tests --package-path LPMVault --disable-index-store --disable-automatic-resolution -Xswiftc -warnings-as-errors
      - name: Record Swift build input timestamps
        run: python3 LPMVault/Scripts/ci-cache-key.py swift --record-source-times
      - name: Swift tests
        env:
          LPM_TEST_SNAPSHOT_DIR: ${{ runner.temp }}/ui-snapshots
          SWIFT_TEST_SHARD: ${{ inputs.shard }}
          SWIFT_TEST_ISOLATED_SUITE: LPMVaultTests.SheetInteractionTests
        run: bash LPMVault/Scripts/swift-test-watchdog.sh --package-path LPMVault --skip-build --disable-automatic-resolution -Xswiftc -warnings-as-errors
      - name: Preserve failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.diagnostics }}
          path: |
            ~/Library/Logs/DiagnosticReports/*
            ${{ runner.temp }}/ui-snapshots/*
          if-no-files-found: ignore
          retention-days: 7
      - name: Cooperative executor regressions
        if: inputs.cooperative
        run: bash LPMVault/Scripts/Tests/cooperative-executor-tests.sh
