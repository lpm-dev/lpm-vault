version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      include: scope
    labels: [dependencies, github-actions]
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
