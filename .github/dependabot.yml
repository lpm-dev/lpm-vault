version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    # Every update in one weekly pull request: main requires up-to-date
    # branches, and ci-cache-key.py hashes ci.yml and swift-tests.yml, so each
    # separate update would cost another full macOS run and cold caches.
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ['*']
