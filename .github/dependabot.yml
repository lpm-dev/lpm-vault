version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    # Every update in one weekly pull request: each pull request costs a run
    # of its own, a merge queue run and a post-merge run on macOS, and
    # ci-cache-key.py hashes the workflows that build, so an update to one
    # starts its cache cold.
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ['*']
