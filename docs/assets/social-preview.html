<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LPM Vault repository social preview</title>
  <style>
    @font-face { font-family: Geist; src: url('../../web/public/fonts/geist-5.3.0-latin.woff2') format('woff2'); font-weight: 100 900; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
    body { font-family: Geist, -apple-system, sans-serif; color: #24212f; background: #f2eff9; }
    main { position: relative; width: 1280px; height: 640px; background: radial-gradient(ellipse at 75% 45%, #ded6fa 0, transparent 65%); }
    header { display: flex; align-items: center; gap: 16px; position: absolute; left: 56px; top: 48px; }
    header img { width: 52px; height: 52px; }
    header span { font-size: 30px; font-weight: 700; letter-spacing: -1px; }
    .copy { position: absolute; left: 56px; top: 174px; width: 394px; }
    h1 { margin: 0 0 22px; font-size: 61px; font-weight: 650; line-height: 1.04; letter-spacing: -3px; }
    p { margin: 0; font-size: 22px; line-height: 1.4; color: #655e77; }
    .facts { margin-top: 30px; font-size: 17px; line-height: 1.65; color: #534c67; }
    .workspace { position: absolute; left: 484px; top: 132px; width: 740px; height: auto; border: 1px solid #d8d1e8; border-radius: 12px; box-shadow: 0 24px 48px #5c46732b; }
    footer { position: absolute; bottom: 38px; left: 56px; right: 56px; display: flex; justify-content: space-between; font-size: 18px; color: #655e77; }
    footer b { color: #5d40c8; font-weight: 600; }
  </style>
</head>
<body>
  <main aria-label="LPM Vault: project secrets for macOS, with a real app screenshot using dummy data">
    <header><img src="../../web/public/lpm-vault.svg" alt=""><span>LPM Vault</span></header>
    <div class="copy">
      <h1>Every .env,<br>one vault.</h1>
      <p>Project secrets for your Mac.<br>Ready for the LPM CLI.</p>
      <p class="facts">Keychain storage · Encrypted sync<br>Free and open source</p>
    </div>
    <img class="workspace" src="vault-workspace.png" alt="Dummy project variables in three environments, with drift and missing-key indicators">
    <footer><b>vault.lpm.dev</b><span>macOS 14+ · Apple silicon and Intel</span></footer>
  </main>
</body>
</html>
