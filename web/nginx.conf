map $uri $vault_cache_control {
    default "no-cache";
    /download "no-store";
    /updates/appcast.xml "no-store";
    ~^/releases/v "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    add_header Cache-Control $vault_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /download {
        return 302 https://github.com/lpm-dev/lpm-vault/releases/latest/download/LPM-Vault.dmg;
    }
    location = /updates/appcast.xml {
        return 302 https://github.com/lpm-dev/lpm-vault/releases/latest/download/appcast.xml;
    }
    location ~ ^/releases/(v[0-9]+\.[0-9]+(?:\.[0-9]+)?)/([A-Za-z0-9][A-Za-z0-9._-]*\.(?:dmg|zip|xml|txt|json))$ {
        return 308 https://github.com/lpm-dev/lpm-vault/releases/download/$1/$2;
    }
    location / {
        try_files $uri =404;
    }
    location = / {
        try_files /index.html =404;
    }
}
