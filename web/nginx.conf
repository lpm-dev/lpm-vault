map $uri $vault_cache_control {
    default "no-cache";
    /download "no-store";
    /updates/appcast.xml "no-store";
    /updates/channels.xml "no-store";
    /ingest/e/ "no-store";
    ~^/releases/v "public, max-age=31536000, immutable";
    ~^/fonts/[^/]+\.woff2$ "public, max-age=31536000, immutable";
    /vendor/metrics-core-1.435.7.js "public, max-age=31536000, immutable";
    ~^/assets/ "public, max-age=31536000, immutable";
}

map $http_origin $vault_event_origin_allowed {
    default 0;
    "" 1;
    "https://vault.lpm.dev" 1;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript text/plain image/svg+xml;
    add_header Cache-Control $vault_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    location = /ingest/e/ {
        if ($request_method != POST) { return 405; }
        if ($vault_event_origin_allowed = 0) { return 403; }
        client_max_body_size 64k;
        resolver ${VAULT_DNS_RESOLVERS} valid=300s;
        resolver_timeout 5s;
        set $vault_posthog_upstream eu.i.posthog.com:443;
        proxy_pass https://$vault_posthog_upstream/e/$is_args$args;
        proxy_set_header Host eu.i.posthog.com;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Referer "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_ssl_name eu.i.posthog.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /download {
        return 302 https://github.com/lpm-dev/lpm-vault/releases/latest/download/LPM-Vault.dmg;
    }
    location = /updates/appcast.xml {
        return 302 https://github.com/lpm-dev/lpm-vault/releases/latest/download/appcast.xml;
    }
    location = /updates/channels.xml {
        return 302 https://raw.githubusercontent.com/lpm-dev/lpm-vault/updates/appcast.xml;
    }
    location ~ "^/releases/(v[0-9]+\.[0-9]+(?:\.[0-9]+)?(?:-nightly\.[0-9]{8}\.[1-9][0-9]*\.(?:[0-9a-f]{7}|g0[0-9]{6}))?)/([A-Za-z0-9][A-Za-z0-9._-]*\.(?:dmg|zip|xml|txt|json))$" {
        return 308 https://github.com/lpm-dev/lpm-vault/releases/download/$1/$2;
    }
    location / {
        try_files $uri =404;
    }
    location = / {
        try_files /index.html =404;
    }
}
